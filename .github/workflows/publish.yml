name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --python ${{ matrix.python }} --isolated python -m unittest discover -s tests -t .

  publish:
    needs: test
    runs-on: ubuntu-latest
    # PyPI's trusted publisher is tied to this environment, so no token is stored anywhere.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check the tag matches both version numbers
        run: |
          test "v$(uv version --short)" = "$GITHUB_REF_NAME"
          test "v$(uv run python -c 'import gengwiki; print(gengwiki.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uv publish --trusted-publishing always
