[project]
name = "gengwiki"
version = "0.9.0"
description = "Python SDK for gengwiki, local first with the API as a fallback"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhixiang Feng", email = "contact@zhixiangfeng.com" }]
keywords = ["gengwiki", "meme", "sdk", "llm", "function-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://gengwiki.niox.lol"
Documentation = "https://gengwiki.niox.lol/docs"
Repository = "https://github.com/Niox1337/gengwiki-python"

[project.scripts]
gengwiki = "gengwiki.__main__:main"

[project.optional-dependencies]
keychain = [
    "keyring>=25",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
